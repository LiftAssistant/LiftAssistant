name: Flutter integration validation

on:
  push:
    branches:
      - integration/flutter-ui-main-20261121

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter toolchain
        run: flutter --version
      - name: Pub get
        working-directory: client
        run: flutter pub get
      - name: Build process-test binaries
        run: |
          cargo build -p liftassistant-headless
          cargo build -p liftassistant-headless --example sim-dev-server
      - name: Analyze
        working-directory: client
        run: dart analyze
      - name: Test
        working-directory: client
        run: flutter test --concurrency=1
      - name: Build web
        working-directory: client
        run: flutter build web --no-web-resources-cdn
