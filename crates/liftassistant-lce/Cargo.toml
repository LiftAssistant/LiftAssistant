[package]
name = "liftassistant-lce"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
liftassistant-model = { path = "../liftassistant-model" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
liftassistant-engine = { path = "../liftassistant-engine" }

[target.'cfg(target_os = "linux")'.dev-dependencies]
libc = "0.2"
rustix = { version = "0.38.44", features = ["event", "fs", "pty", "rand", "termios"] }
