[package]
name = "liftassistant-headless"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
axum = "0.8"
getrandom = "0.3"
liftassistant-engine = { path = "../liftassistant-engine" }
liftassistant-model = { path = "../liftassistant-model" }
liftassistant-rmf = { path = "../liftassistant-rmf" }
liftassistant-runtime = { path = "../liftassistant-runtime" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
tokio = { version = "1", features = ["net", "rt-multi-thread", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }

[dev-dependencies]
liftassistant-sim = { path = "../liftassistant-sim" }

[[example]]
name = "sim-dev-server"
path = "examples/sim_dev_server/main.rs"
test = true
